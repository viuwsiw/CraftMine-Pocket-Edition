<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1b1b1b">
  <title>CraftMine: Pocket Edition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- Главный экран -->
  <section id="screen-menu" class="screen menu-bg">
    <div class="logo-wrap">
      <h1 class="logo">CraftMine</h1>
      <div class="subtitle">Pocket Edition</div>
      <div class="version-top">v0.0.2 alpha</div>
    </div>
    <div class="tiles">
      <button class="tile locked" id="btn-multi"><span class="tile-label">Мультиплеер</span><img class="tile-icon" id="icon-multi" alt=""><span class="tile-badge">скоро</span></button>
      <button class="tile" id="btn-play"><span class="tile-label">Играть</span><img class="tile-icon" id="icon-play" alt=""></button>
      <button class="tile" id="btn-settings"><span class="tile-label">Настройки</span><img class="tile-icon" id="icon-settings" alt=""></button>
    </div>
    <div class="player-tag">Игрок: <span>Nikita</span></div>
  </section>

  <!-- Список миров -->
  <section id="screen-worlds" class="screen dirt-bg hidden">
    <div class="panel-title">Выбор мира</div>
    <div class="worlds-list" id="worlds-list"></div>
    <div class="row-buttons">
      <button class="btn" id="btn-worlds-back">Назад</button>
      <button class="btn green" id="btn-new-world">Создать новый</button>
    </div>
  </section>

  <!-- Создание мира -->
  <section id="screen-create" class="screen dirt-bg hidden">
    <div class="panel-title">Создание мира</div>
    <div class="form">
      <label class="field">
        <span>Название мира</span>
        <input id="world-name" type="text" maxlength="32" value="Мой мир" autocomplete="off">
      </label>
      <label class="field">
        <span>Сид (можно оставить пустым)</span>
        <input id="world-seed" type="text" maxlength="32" placeholder="Случайный" autocomplete="off">
      </label>
      <div class="field">
        <span>Режим игры</span>
        <div class="toggle" id="world-mode">
          <button class="btn small selected" data-mode="survival">Выживание</button>
          <button class="btn small" data-mode="creative">Творческий</button>
        </div>
        <div class="hint" id="mode-hint">Пустой инвентарь, сердца и урон. Добывай блоки сам.</div>
      </div>
      <div class="field">
        <span>Тип мира</span>
        <div class="toggle" id="world-type">
          <button class="btn small selected" data-type="normal">Обычный</button>
          <button class="btn small" data-type="flat">Плоский</button>
        </div>
      </div>
      <div class="hint">Игровой персонаж: Nikita</div>
    </div>
    <div class="row-buttons">
      <button class="btn" id="btn-create-back">Назад</button>
      <button class="btn green" id="btn-create">Создать мир</button>
    </div>
  </section>

  <!-- Настройки -->
  <section id="screen-settings" class="screen dirt-bg hidden">
    <div class="panel-title">Настройки</div>
    <div class="form">
      <label class="field">
        <span>Дальность прорисовки: <b id="val-rd"></b> чанк.</span>
        <input id="set-rd" type="range" min="2" max="8" step="1">
      </label>
      <label class="field">
        <span>Чувствительность: <b id="val-sens"></b>%</span>
        <input id="set-sens" type="range" min="30" max="250" step="10">
      </label>
      <label class="check"><input id="set-autojump" type="checkbox"> Автопрыжок</label>
      <label class="check"><input id="set-falldmg" type="checkbox"> Урон от падения</label>
      <label class="check"><input id="set-coords" type="checkbox"> Показывать координаты и FPS</label>
    </div>
    <div class="row-buttons">
      <button class="btn green" id="btn-settings-done">Готово</button>
    </div>
  </section>

  <!-- Загрузка -->
  <section id="screen-loading" class="screen dirt-bg hidden">
    <div class="loading-box">
      <div class="loading-title" id="loading-title">Генерация мира</div>
      <div class="loading-sub" id="loading-sub">Строим ландшафт...</div>
      <div class="bar"><div class="bar-fill" id="loading-bar"></div></div>
    </div>
  </section>

  <!-- Игровой интерфейс -->
  <section id="hud" class="hidden">
    <div id="look-zone"></div>
    <div id="hurt"></div>
    <div id="bottom-bar">
      <div id="item-name"></div>
      <div id="hearts"></div>
      <div class="hotbar-row"><div id="hotbar"></div><button id="btn-inv" aria-label="Инвентарь"><i></i><i></i><i></i></button></div>
    </div>
    <div id="debug" class="hidden"></div>
    <button id="btn-pause" aria-label="Пауза"><i></i><i></i></button>
    <button id="btn-view" aria-label="Вид от третьего лица"><svg viewBox="0 0 16 16"><circle cx="8" cy="4.2" r="2.6"/><rect x="4.5" y="7.6" width="7" height="7" rx="1"/></svg></button>
    <div id="sleep"></div>
    <div id="dpad">
      <div class="dp diag" data-dir="ul"></div>
      <div class="dp" data-dir="up"><svg viewBox="0 0 10 10"><path d="M5 2 L9 7 L1 7 Z"/></svg></div>
      <div class="dp diag" data-dir="ur"></div>
      <div class="dp" data-dir="left"><svg viewBox="0 0 10 10"><path d="M2 5 L7 1 L7 9 Z"/></svg></div>
      <div class="dp jump" data-dir="jump"><span></span></div>
      <div class="dp" data-dir="right"><svg viewBox="0 0 10 10"><path d="M8 5 L3 1 L3 9 Z"/></svg></div>
      <div class="dp empty"></div>
      <div class="dp" data-dir="down"><svg viewBox="0 0 10 10"><path d="M5 8 L9 3 L1 3 Z"/></svg></div>
      <div class="dp fly" data-dir="fdown"><svg viewBox="0 0 10 10"><path d="M5 9 L9 4 L6.5 4 L6.5 1 L3.5 1 L3.5 4 L1 4 Z"/></svg></div>
    </div>
  </section>

  <!-- Пауза -->
  <section id="screen-pause" class="screen dim-bg hidden">
    <div class="panel-title">Игра на паузе</div>
    <div class="pause-info" id="pause-info"></div>
    <div class="menu-buttons">
      <button class="btn big" id="btn-resume">Продолжить</button>
      <button class="btn" id="btn-pause-settings">Настройки</button>
      <button class="btn" id="btn-quit">Сохранить и выйти</button>
    </div>
  </section>

  <!-- Инвентарь, крафт, сундук, печь: категории слева, разделы справа, панель быстрого доступа остаётся снизу -->
  <section id="screen-inv" class="inv-screen hidden">
    <div class="inv-tabs left" id="inv-tabs-left"></div>
    <div class="inv-main">
      <div class="inv-content" id="inv-content"></div>
      <div class="inv-bar">
        <span class="inv-info" id="inv-info"></span>
        <span class="inv-ing" id="inv-ing"></span>
        <button class="inv-btn green hidden" id="btn-craft">Создать</button>
        <button class="inv-btn" id="btn-drop">Выбросить</button>
      </div>
    </div>
    <div class="inv-tabs right">
      <button class="inv-x" id="btn-inv-close" aria-label="Закрыть">✕</button>
      <div id="inv-tabs-right"></div>
    </div>
  </section>

  <!-- Смерть -->
  <section id="screen-dead" class="screen dead-bg hidden">
    <div class="dead-title">Вы погибли!</div>
    <div class="pause-info">Вещи остались на месте гибели</div>
    <div class="menu-buttons">
      <button class="btn big" id="btn-respawn">Возродиться</button>
      <button class="btn" id="btn-dead-quit">Выйти в меню</button>
    </div>
  </section>

  <div id="toast" class="hidden"></div>
  <div id="error" class="hidden"></div>

  <script src="js/noise.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/player.js"></script>
  <script src="js/items.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
